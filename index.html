<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Alphabet Activity Book (Ages 3-6)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;700&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-gradient: linear-gradient(90deg, #dcfce7 0%, #e0f2fe 50%, #dbeafe 100%);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .arabic-ui {
            font-family: 'Cairo', sans-serif;
        }

        .workbook-page {
            width: 210mm;
            height: 297mm;
            background: var(--page-gradient);
            padding: 14mm;
            box-sizing: border-box;
            position: relative;
            margin: 20px auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        .page-border {
            width: 100%;
            height: 100%;
            border: 4px dashed #1e293b;
            border-radius: 28px;
            box-sizing: border-box;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            background: rgba(255, 255, 255, 0.28);
        }

        .trace-line-container {
            position: relative;
            width: 100%;
            height: 110px;
            border-top: 3px solid #64748b;
            border-bottom: 3px solid #64748b;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 12px;
        }

        .trace-line-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 2.5px dashed #94a3b8;
            z-index: 1;
        }

        .trace-svg-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            fill: none;
            stroke: #1e293b;
            stroke-width: 3px;
            stroke-dasharray: 2, 7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .coloring-text {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            fill: #ffffff;
            stroke: #0f172a;
            stroke-width: 5px;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: pointer;
            transition: fill 0.2s ease;
        }

        .coloring-text:hover {
            stroke: #3b82f6;
        }

        .letter-bubble {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            border: 3.5px dashed #334155;
            background: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .letter-bubble.circled::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 5px solid #16a34a;
            border-radius: 50%;
            animation: popIn 0.25s ease-out;
        }

        .page-interactive-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            touch-action: none;
            cursor: crosshair;
        }

        .interactive-widget {
            position: relative;
            z-index: 40;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 850px) {
            .workbook-page-wrapper {
                overflow-x: auto;
                padding: 10px;
                display: flex;
                justify-content: center;
            }
            .workbook-page {
                transform: scale(0.46);
                transform-origin: top center;
                margin-bottom: -155mm;
            }
        }

        @media (min-width: 851px) and (max-width: 1100px) {
            .workbook-page {
                transform: scale(0.75);
                transform-origin: top center;
                margin-bottom: -70mm;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: white;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            .workbook-page {
                margin: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always;
                break-after: page;
                transform: none !important;
                width: 210mm !important;
                height: 297mm !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Control Bar -->
    <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-400 to-sky-500 flex items-center justify-center text-white font-bold text-2xl shadow-md">
                    Aa
                </div>
                <div>
                    <h1 class="arabic-ui font-bold text-slate-800 text-lg leading-tight">كتيب أنشطة الحروف الإنجليزية (Ages 3-6 • 52 3D Images Wired)</h1>
                    <p class="text-xs text-slate-500">مربوط بـ 52 صورة ثلاثية الأبعاد (A1-apple.png – Z2-zero.png) + QR Code تفاعلي</p>
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 arabic-ui">
                <label class="text-sm font-bold text-slate-700 ml-1">اختر الحرف:</label>
                <select id="letterSelector" onchange="jumpToLetter(this.value)" class="bg-slate-100 border border-slate-300 text-slate-800 text-sm rounded-xl px-3 py-2 font-bold focus:ring-2 focus:ring-sky-400 outline-none">
                </select>

                <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200">
                    <button onclick="prevPage()" class="px-3 py-1.5 rounded-lg hover:bg-white hover:shadow-sm text-slate-700 font-bold text-sm transition">
                        ◀ السابق
                    </button>
                    <span id="pageIndicator" class="px-3 text-xs font-bold text-slate-600">1 / 132</span>
                    <button onclick="nextPage()" class="px-3 py-1.5 rounded-lg hover:bg-white hover:shadow-sm text-slate-700 font-bold text-sm transition">
                        التالي ▶
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2 arabic-ui">
                <button onclick="speakCurrentLetter()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5 shadow-sm">
                    <span>🔊</span> نطق الحرف والكلمة
                </button>
                <button onclick="printCurrentLetterOnly()" class="bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold px-3.5 py-2 rounded-xl text-xs sm:text-sm transition flex items-center gap-1.5">
                    <span>🖨️</span> طباعة الحرف (5 صفحات)
                </button>
                <button onclick="printFullBook()" class="bg-gradient-to-r from-emerald-500 to-sky-600 hover:from-emerald-600 hover:to-sky-700 text-white font-bold px-4 py-2 rounded-xl text-xs sm:text-sm shadow-md transition flex items-center gap-1.5">
                    <span>📄</span> حفظ الكتيب PDF
                </button>
            </div>
        </div>

        <!-- Kid's Interactive Toolbar -->
        <div class="bg-slate-50 border-t border-slate-200 px-4 py-2.5">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-2 arabic-ui">
                    <span class="text-xs font-bold text-slate-700">🛠️ أداة الطفل:</span>
                    <button id="toolPen" onclick="setTool('pen')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition flex items-center gap-1">
                        ✏️ قلم كتابة وتتبع النقاط
                    </button>
                    <button id="toolBrush" onclick="setTool('brush')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition flex items-center gap-1">
                        🖍️ فرشاة تلوين عريضة
                    </button>
                    <button id="toolEraser" onclick="setTool('eraser')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition flex items-center gap-1">
                        🧽 ممحاة (أستيكة)
                    </button>
                    <button onclick="clearCurrentPageDrawing()" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-rose-100 text-rose-700 hover:bg-rose-200 transition flex items-center gap-1">
                        🗑️ مسح الصفحة
                    </button>
                </div>

                <div class="flex items-center gap-2 arabic-ui text-xs font-bold text-slate-600">
                    <span>🎨 اختر اللون:</span>
                    <div id="colorPalette" class="flex items-center gap-2">
                        <button onclick="setColor('#ef4444')" class="w-7 h-7 rounded-full bg-red-500 ring-2 ring-offset-2 ring-slate-800 scale-110 transition"></button>
                        <button onclick="setColor('#f97316')" class="w-7 h-7 rounded-full bg-orange-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#eab308')" class="w-7 h-7 rounded-full bg-yellow-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#22c55e')" class="w-7 h-7 rounded-full bg-green-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#0ea5e9')" class="w-7 h-7 rounded-full bg-sky-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#8b5cf6')" class="w-7 h-7 rounded-full bg-violet-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#ec4899')" class="w-7 h-7 rounded-full bg-pink-500 hover:scale-110 transition"></button>
                        <button onclick="setColor('#1e293b')" class="w-7 h-7 rounded-full bg-slate-800 hover:scale-110 transition"></button>
                    </div>
                </div>

                <div id="authorQrBox" class="flex items-center gap-2 arabic-ui text-xs bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-xl">
                    <span class="font-bold text-emerald-800">🔗 رابط الـ QR Code:</span>
                    <input id="customQrUrlInput" type="url" dir="ltr" value="https://talyahrabie.github.io/alphabet-book/" oninput="updateQrUrl(this.value)" class="bg-white border border-emerald-300 rounded-lg px-2.5 py-1 text-xs text-slate-700 w-64 focus:outline-none focus:ring-2 focus:ring-emerald-400" />
                </div>
            </div>
        </div>
    </header>

    <main id="interactiveContainer" class="no-print flex-1 workbook-page-wrapper py-4">
        <div id="activePageSlot"></div>
    </main>

    <div id="printContainer" class="hidden print:block"></div>

    <script>
        // Complete 52-Image Wired Curriculum Data matching your exact filenames & subjects
        const alphabetData = [
            { letter: 'A', lower: 'a', word: 'APPLE', img1: 'A1-apple.png', emoji: '🍎', secondWord: 'Ant', img2: 'A2-ant.png', secondEmoji: '🐜', distractors: ['B', 'C', 'e', 'm', 'R', 's', 'T'] },
            { letter: 'B', lower: 'b', word: 'BALL', img1: 'B1-ball.png', emoji: '⚽', secondWord: 'Bee', img2: 'B2-bee.png', secondEmoji: '🐝', distractors: ['P', 'd', 'R', 'a', 'E', 'q', 's'] },
            { letter: 'C', lower: 'c', word: 'CAT', img1: 'C1-cat.png', emoji: '🐱', secondWord: 'Car', img2: 'C2-car.png', secondEmoji: '🚗', distractors: ['O', 'G', 'e', 's', 'a', 'u', 'D'] },
            { letter: 'D', lower: 'd', word: 'DUCK', img1: 'D1-duck.png', emoji: '🦆', secondWord: 'Dog', img2: 'D2-dog.png', secondEmoji: '🐶', distractors: ['b', 'P', 'O', 'a', 'q', 'C', 'g'] },
            { letter: 'E', lower: 'e', word: 'EGG', img1: 'E1-egg.png', emoji: '🥚', secondWord: 'Elephant', img2: 'E2-elephant.png', secondEmoji: '🐘', distractors: ['F', 'c', 'a', 'B', 'L', 'o', 'H'] },
            { letter: 'F', lower: 'f', word: 'FISH', img1: 'F1-fish.png', emoji: '🐟', secondWord: 'Frog', img2: 'F2-frog.png', secondEmoji: '🐸', distractors: ['E', 't', 'P', 'r', 'L', 'k', 'b'] },
            { letter: 'G', lower: 'g', word: 'GRAPES', img1: 'G1-grapes.png', emoji: '🍇', secondWord: 'Goat', img2: 'G2-goat.png', secondEmoji: '🐐', distractors: ['C', 'q', 'p', 'O', 'y', 'd', 'a'] },
            { letter: 'H', lower: 'h', word: 'HAT', img1: 'H1-hat.png', emoji: '👒', secondWord: 'Horse', img2: 'H2-horse.png', secondEmoji: '🐴', distractors: ['n', 'M', 'b', 'k', 'A', 'T', 'r'] },
            { letter: 'I', lower: 'i', word: 'ICE CREAM', img1: 'I1-ice-cream.png', emoji: '🍦', secondWord: 'Insect', img2: 'I2-insect.png', secondEmoji: '🐞', distractors: ['j', 'L', 'T', 'l', 'f', 'r', 'E'] },
            { letter: 'J', lower: 'j', word: 'JUICE', img1: 'J1-juice.png', emoji: '🧃', secondWord: 'Jeans', img2: 'J2-jeans.png', secondEmoji: '👖', distractors: ['i', 'U', 'g', 'y', 'L', 't', 'p'] },
            { letter: 'K', lower: 'k', word: 'KITE', img1: 'K1-kite.png', emoji: '🪁', secondWord: 'Koala', img2: 'K2-koala.png', secondEmoji: '🐨', distractors: ['R', 'h', 'X', 'b', 'Y', 'l', 'N'] },
            { letter: 'L', lower: 'l', word: 'LION', img1: 'L1-lion.png', emoji: '🦁', secondWord: 'Leaf', img2: 'L2-leaf.png', secondEmoji: '🍃', distractors: ['I', 't', 'F', 'E', 'j', 'r', 'k'] },
            { letter: 'M', lower: 'm', word: 'MONKEY', img1: 'M1-monkey.png', emoji: '🐵', secondWord: 'Moon', img2: 'M2-moon.png', secondEmoji: '🌙', distractors: ['W', 'n', 'N', 'H', 'u', 'v', 'r'] },
            { letter: 'N', lower: 'n', word: 'NOSE', img1: 'N1-nose.png', emoji: '👃', secondWord: 'Nut', img2: 'N2-nut.png', secondEmoji: '🌰', distractors: ['m', 'M', 'u', 'h', 'Z', 'r', 'H'] },
            { letter: 'O', lower: 'o', word: 'ORANGE', img1: 'O1-orange.png', emoji: '🍊', secondWord: 'Owl', img2: 'O2-owl.png', secondEmoji: '🦉', distractors: ['C', 'Q', 'a', 'e', 'D', 'c', 'g'] },
            { letter: 'P', lower: 'p', word: 'PIZZA', img1: 'P1-pizza.png', emoji: '🍕', secondWord: 'Penguin', img2: 'P2-penguin.png', secondEmoji: '🐧', distractors: ['b', 'q', 'R', 'd', 'B', 'g', 'a'] },
            { letter: 'Q', lower: 'q', word: 'QUEEN', img1: 'Q1-queen.png', emoji: '👑', secondWord: 'Question', img2: 'Q2-question.png', secondEmoji: '❓', distractors: ['O', 'p', 'g', 'd', 'b', 'G', 'a'] },
            { letter: 'R', lower: 'r', word: 'RABBIT', img1: 'R1-rabbit.png', emoji: '🐰', secondWord: 'Rainbow', img2: 'R2-rainbow.png', secondEmoji: '🌈', distractors: ['P', 'B', 'n', 'k', 'f', 'h', 't'] },
            { letter: 'S', lower: 's', word: 'SUN', img1: 'S1-sun.png', emoji: '☀️', secondWord: 'Star', img2: 'S2-star.png', secondEmoji: '⭐', distractors: ['Z', 'c', 'z', 'e', 'a', 'G', 'o'] },
            { letter: 'T', lower: 't', word: 'TREE', img1: 'T1-tree.png', emoji: '🌳', secondWord: 'Tiger', img2: 'T2-tiger.png', secondEmoji: '🐯', distractors: ['I', 'f', 'L', 'l', 'i', 'F', 'r'] },
            { letter: 'U', lower: 'u', word: 'UMBRELLA', img1: 'U1-umbrella.png', emoji: '☂️', secondWord: 'Unicorn', img2: 'U2-unicorn.png', secondEmoji: '🦄', distractors: ['n', 'V', 'v', 'J', 'w', 'm', 'o'] },
            { letter: 'V', lower: 'v', word: 'VAN', img1: 'V1-van.png', emoji: '🚐', secondWord: 'Violin', img2: 'V2-violin.png', secondEmoji: '🎻', distractors: ['U', 'w', 'W', 'y', 'u', 'A', 'n'] },
            { letter: 'W', lower: 'w', word: 'WATCH', img1: 'W1-watch.png', emoji: '⌚', secondWord: 'Whale', img2: 'W2-whale.png', secondEmoji: '🐳', distractors: ['M', 'v', 'V', 'm', 'u', 'N', 'y'] },
            { letter: 'X', lower: 'x', word: 'X-RAY', img1: 'X1-x-ray.png', emoji: '🩻', secondWord: 'X-mark', img2: 'X2-x-mark.png', secondEmoji: '❌', distractors: ['K', 'z', 'Y', 'v', 'k', 'Z', 'w'] },
            { letter: 'Y', lower: 'y', word: 'YO-YO', img1: 'Y1-yo-yo.png', emoji: '🪀', secondWord: 'Yacht', img2: 'Y2-yacht.png', secondEmoji: '⛵', distractors: ['V', 'v', 'g', 'j', 'X', 'u', 'K'] },
            { letter: 'Z', lower: 'z', word: 'ZEBRA', img1: 'Z1-zebra.png', emoji: '🦓', secondWord: 'Zero', img2: 'Z2-zero.png', secondEmoji: '0️⃣', distractors: ['S', 's', 'N', 'x', 'X', 'e', 'c'] }
        ];

        // Smart 3D Image Renderer: Checks root folder -> then 'images/' folder -> then falls back to Emoji if not uploaded yet
        function renderIllustration(imgFile, fallbackEmoji, imgClasses = 'w-20 h-20', emojiClasses = 'text-6xl') {
            return `<span class="inline-flex items-center justify-center align-middle select-none">
                <img src="${imgFile}" alt="" class="${imgClasses} object-contain rounded-2xl bg-white p-1 shadow-sm"
                     onerror="if(!this.dataset.triedSub){this.dataset.triedSub='1';this.src='images/'+this.getAttribute('src');}else{this.style.display='none';this.nextElementSibling.style.display='inline-block';}" />
                <span class="${emojiClasses}" style="display:none;">${fallbackEmoji}</span>
            </span>`;
        }

        let currentColor = '#ef4444';
        let currentTool = 'pen';
        let currentPageIndex = 0;
        let allPagesList = [];
        let interactiveAppUrl = 'https://talyahrabie.github.io/alphabet-book/';
        const savedPageDrawings = {};

        function updateQrUrl(val) {
            interactiveAppUrl = val.trim() || 'https://talyahrabie.github.io/alphabet-book/';
            if (currentPageIndex === 0) {
                renderCurrentPage();
            }
        }

        function setColor(hex) {
            currentColor = hex;
            if (currentTool === 'eraser') {
                setTool('pen');
            }
            const buttons = document.querySelectorAll('#colorPalette button');
            buttons.forEach(btn => {
                btn.classList.remove('ring-2', 'ring-offset-2', 'ring-slate-800', 'scale-110');
                if (btn.getAttribute('onclick').includes(hex)) {
                    btn.classList.add('ring-2', 'ring-offset-2', 'ring-slate-800', 'scale-110');
                }
            });
        }

        function setTool(toolName) {
            currentTool = toolName;
            const tools = {
                pen: document.getElementById('toolPen'),
                brush: document.getElementById('toolBrush'),
                eraser: document.getElementById('toolEraser')
            };
            Object.keys(tools).forEach(k => {
                if (k === toolName) {
                    tools[k].className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-sm transition flex items-center gap-1';
                } else {
                    tools[k].className = 'px-3 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-700 border border-slate-300 hover:bg-slate-100 transition flex items-center gap-1';
                }
            });
        }

        function speakCurrentLetter() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const pageObj = allPagesList[currentPageIndex];
            let textToSpeak = "My Alphabet Activity Book";
            if (pageObj && pageObj.data) {
                const d = pageObj.data;
                textToSpeak = `${d.letter}! ${d.letter} is for ${d.word.toLowerCase()}, and ${d.secondWord.toLowerCase()}.`;
            } else if (pageObj && pageObj.type === 'cert') {
                textToSpeak = "Congratulations! Great job completing your Alphabet Activity Book!";
            }
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            utterance.pitch = 1.15;
            window.speechSynthesis.speak(utterance);
        }

        function buildPageRegistry() {
            allPagesList = [];
            allPagesList.push({ type: 'cover' });

            alphabetData.forEach((item, idx) => {
                allPagesList.push({ type: 'color', data: item, letterIdx: idx });
                allPagesList.push({ type: 'trace', data: item, letterIdx: idx });
                allPagesList.push({ type: 'find', data: item, letterIdx: idx });
                allPagesList.push({ type: 'draw', data: item, letterIdx: idx });
                allPagesList.push({ type: 'match', data: item, letterIdx: idx });
            });

            allPagesList.push({ type: 'cert' });

            const sel = document.getElementById('letterSelector');
            let html = `<option value="0">📖 الغلاف (Cover Page)</option>`;
            alphabetData.forEach((item, idx) => {
                const startPage = 1 + idx * 5;
                html += `<option value="${startPage}">${item.emoji} Letter ${item.letter}${item.lower} - ${item.word} & ${item.secondWord}</option>`;
            });
            html += `<option value="${allPagesList.length - 1}">🎓 شهادة التقدير (Certificate)</option>`;
            sel.innerHTML = html;
        }

        function generatePageHTML(pageObj, pageNumber) {
            if (pageObj.type === 'cover') {
                const encodedUrl = encodeURIComponent(interactiveAppUrl);
                const qrImgSrc = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=6&data=${encodedUrl}`;

                return `
                <div class="workbook-page">
                    <div class="page-border justify-between py-6">
                        <div class="text-center space-y-2">
                            <div class="inline-flex items-center gap-2 bg-white/90 text-sky-800 font-bold px-6 py-1.5 rounded-full text-base border-2 border-sky-400 shadow-sm">
                                <span>🌟 PRESCHOOL & KINDERGARTEN (KG1 - KG2)</span>
                                <span>•</span>

        function fillColorElement(el) {
            el.style.fill = currentColor;
        }

        function clearCurrentPageDrawing() {
            delete savedPageDrawings[currentPageIndex];
            renderCurrentPage();
        }

        function initCanvases(container) {
            const canvases = container.querySelectorAll('.page-interactive-canvas');
            canvases.forEach(canvas => {
                canvas.width = 794;
                canvas.height = 1123;
                const ctx = canvas.getContext('2d');
                let drawing = false;

                if (savedPageDrawings[currentPageIndex]) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = savedPageDrawings[currentPageIndex];
                }

                const getPos = (e) => {
                    const r = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: (clientX - r.left) * (canvas.width / r.width),
                        y: (clientY - r.top) * (canvas.height / r.height)
                    };
                };

                const start = (e) => {
                    drawing = true;
                    const pos = getPos(e);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                };

                const move = (e) => {
                    if (!drawing) return;
                    if (e.cancelable) e.preventDefault();
                    const pos = getPos(e);

                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    if (currentTool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = 32;
                    } else if (currentTool === 'brush') {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = currentColor + '66';
                        ctx.lineWidth = 26;
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = 7;
                    }

                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                };

                const end = () => {
                    if (drawing) {
                        drawing = false;
                        savedPageDrawings[currentPageIndex] = canvas.toDataURL();
                    }
                };

                canvas.addEventListener('mousedown', start);
                canvas.addEventListener('mousemove', move);
                window.addEventListener('mouseup', end);

                canvas.addEventListener('touchstart', start, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', end);
            });
        }

        function renderCurrentPage() {
            const slot = document.getElementById('activePageSlot');
            const pageObj = allPagesList[currentPageIndex];
            slot.innerHTML = generatePageHTML(pageObj, currentPageIndex + 1);
            document.getElementById('pageIndicator').textContent = `${currentPageIndex + 1} / ${allPagesList.length}`;

            const sel = document.getElementById('letterSelector');
            if (currentPageIndex === 0) {
                sel.value = "0";
            } else if (currentPageIndex === allPagesList.length - 1) {
                sel.value = String(allPagesList.length - 1);
            } else {
                const letterStart = Math.floor((currentPageIndex - 1) / 5) * 5 + 1;
                sel.value = String(letterStart);
            }

            setTimeout(() => initCanvases(slot), 50);
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderCurrentPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            if (currentPageIndex < allPagesList.length - 1) {
                currentPageIndex++;
                renderCurrentPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToLetter(pageIdxStr) {
            currentPageIndex = parseInt(pageIdxStr, 10) || 0;
            renderCurrentPage();
        }

        function printCurrentLetterOnly() {
            const printBox = document.getElementById('printContainer');
            let pagesToPrint = [];

            if (currentPageIndex === 0 || currentPageIndex === allPagesList.length - 1) {
                pagesToPrint.push(allPagesList[currentPageIndex]);
            } else {
                const startIdx = Math.floor((currentPageIndex - 1) / 5) * 5 + 1;
                for (let i = startIdx; i < startIdx + 5; i++) {
                    pagesToPrint.push(allPagesList[i]);
                }
            }

            printBox.innerHTML = pagesToPrint.map((p, idx) => generatePageHTML(p, idx + 1)).join('');
            window.print();
        }

        function printFullBook() {
            const printBox = document.getElementById('printContainer');
            printBox.innerHTML = allPagesList.map((p, idx) => generatePageHTML(p, idx + 1)).join('');
            window.print();
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hostname.includes('netlify.app') || window.location.hostname.includes('github.io')) {
                const authorBox = document.getElementById('authorQrBox');
                if (authorBox) authorBox.style.display = 'none';
            }
            buildPageRegistry();
            renderCurrentPage();
        });
    </script>
