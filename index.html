    <style>
        :root {
            --page-gradient: linear-gradient(90deg, #dcfce7 0%, #e0f2fe 50%, #dbeafe 100%);
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 0;
        }

        .arabic-ui {
            font-family: 'Cairo', sans-serif;
        }

        .workbook-page {
            width: 210mm;
            height: 297mm;
            background: var(--page-gradient);
            padding: 14mm;
            box-sizing: border-box;
            position: relative;
            margin: 20px auto;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        .page-border {
            width: 100%;
            height: 100%;
            border: 4px dashed #1e293b;
            border-radius: 28px;
            box-sizing: border-box;
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            background: rgba(255, 255, 255, 0.28);
        }

        .trace-line-container {
            position: relative;
            width: 100%;
            height: 110px;
            border-top: 3px solid #64748b;
            border-bottom: 3px solid #64748b;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 12px;
        }

        .trace-line-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 2.5px dashed #94a3b8;
            z-index: 1;
        }

        .trace-svg-text {
            font-family: 'Andika', 'Fredoka', sans-serif;
            font-weight: 700;
            fill: none;
            stroke: #1e293b;
            stroke-width: 3px;
            stroke-dasharray: 2, 7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .coloring-text {
            font-family: 'Andika', 'Fredoka', sans-serif;
            font-weight: 700;
            fill: #ffffff;
            stroke: #0f172a;
            stroke-width: 5px;
            stroke-linecap: round;
            stroke-linejoin: round;
            cursor: pointer;
            transition: fill 0.2s ease;
        }

        .coloring-text:hover {
            stroke: #3b82f6;
        }

        .letter-bubble {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3.5px dashed #334155;
            background: rgba(255, 255, 255, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .letter-bubble.circled::after {
            content: '';
            position: absolute;
            inset: -8px;
            border: 5px solid #16a34a;
            border-radius: 50%;
            animation: popIn 0.25s ease-out;
        }

        .page-interactive-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            touch-action: none;
            cursor: crosshair;
        }

        .interactive-widget {
            position: relative;
            z-index: 40;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 850px) {
            .workbook-page-wrapper {
                overflow-x: auto;
                padding: 10px;
                display: flex;
                justify-content: center;
            }
            .workbook-page {
                transform: scale(0.46);
                transform-origin: top center;
                margin-bottom: -155mm;
            }
        }

        @media (min-width: 851px) and (max-width: 1100px) {
            .workbook-page {
                transform: scale(0.75);
                transform-origin: top center;
                margin-bottom: -70mm;
            }
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            body {
                background: white;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            .workbook-page {
                margin: 0 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always;
                break-after: page;
                transform: none !important;
                width: 210mm !important;
                height: 297mm !important;
            }
        }
    </style>

        // Multi-Format Image Loader: Automatically tries .jpg -> .png -> .jpeg (in root and 'images/' folder) -> then Emoji fallback
        function handleImgFallback(imgEl) {
            const base = imgEl.dataset.base;
            const step = parseInt(imgEl.dataset.step || '0', 10);
            const candidates = [
                base + '.jpg',
                base + '.png',
                base + '.jpeg',
                'images/' + base + '.jpg',
                'images/' + base + '.png',
                'images/' + base + '.jpeg'
            ];
            if (step < candidates.length) {
                imgEl.dataset.step = String(step + 1);
                imgEl.src = candidates[step];
            } else {
                imgEl.style.display = 'none';
                if (imgEl.nextElementSibling) {
                    imgEl.nextElementSibling.style.display = 'inline-block';
                }
            }
        }

                <img src="${baseName}.jpg" data-base="${baseName}" data-step="0" alt="" class="${imgClasses} object-contain rounded-2xl bg-white p-1 shadow-sm"

                <span class="${emojiClasses}" style="display:none;">${fallbackEmoji}</span>

                    <div class="page-border">
                        <div class="text-center space-y-1">
                            <h2 class="text-4xl font-bold text-slate-900">Draw & Write!</h2>
                            <p class="text-2xl font-semibold text-slate-700">Draw something that starts with <span class="text-sky-700 font-bold">${d.letter}${d.lower}</span> (like ${d.word.toLowerCase()} or ${d.secondWord.toLowerCase()})</p>
                        </div>

                        <div class="w-full flex-1 my-4 bg-white/90 border-4 border-slate-800 rounded-3xl relative overflow-hidden shadow-inner flex flex-col justify-between p-4">
                            <div class="flex justify-between items-center opacity-80 pointer-events-none">
                                <span class="text-4xl font-bold text-slate-400">${d.letter}${d.lower}</span>
                                <div class="flex items-center gap-2">
                                    ${renderIllustration(d.img1, d.emoji, 'w-14 h-14', 'text-4xl')}
                                    ${renderIllustration(d.img2, d.secondEmoji, 'w-14 h-14', 'text-4xl')}
                                </div>
                            </div>
                            <div class="text-center text-slate-400 text-sm pointer-events-none z-10">
                                Draw freely anywhere inside this box & write on the lines below!
                            </div>
                        </div>

                        <div class="w-full space-y-1 mb-2">
                            <p class="text-xl font-bold text-slate-800 text-center">Write the letter ${d.letter} ${d.lower} by yourself:</p>
                            <div class="trace-line-container h-24">
                                <span class="text-5xl font-bold text-slate-300 select-none">${d.letter} ${d.lower}</span>
                                <span class="w-24"></span>
                                <span class="w-24"></span>
                            </div>
                        </div>

                        <div class="w-full flex justify-between items-center text-slate-600 font-bold text-sm px-2">
                            <span>English Alphabet (Ages 3–6)</span>
                            <span>Letter ${d.letter}${d.lower} • Page 4</span>
                        </div>
                    </div>
                    <canvas class="page-interactive-canvas" data-page="${pageNumber}"></canvas>
                </div>`;
            }

            if (pageObj.type === 'match') {
                const nextIdx = (pageObj.letterIdx + 1) % alphabetData.length;
                const item2 = alphabetData[nextIdx];

                const leftCol = [
                    { label: d.letter, tag: '1' },
                    { label: d.lower, tag: '2' },
                    { label: `${d.letter}${d.lower}`, tag: '3' },
                    { label: item2.letter, tag: '4' }
                ];

                const rightCol = [
                    { html: renderIllustration(d.img2, d.secondEmoji, 'w-14 h-14', 'text-4xl'), text: d.secondWord, matchTag: '3' },
                    { html: renderIllustration(item2.img1, item2.emoji, 'w-14 h-14', 'text-4xl'), text: item2.word, matchTag: '4' },
                    { html: `<span class="text-4xl font-bold text-sky-700">${d.lower}</span>`, text: `Small ${d.lower}`, matchTag: '1' },
                    { html: renderIllustration(d.img1, d.emoji, 'w-14 h-14', 'text-4xl'), text: d.word, matchTag: '2' }
                ];

                return `
                <div class="workbook-page">
                    <div class="page-border">
                        <div class="text-center space-y-1">
                            <h2 class="text-4xl font-bold text-slate-900">Draw a line to match</h2>
                            <p class="text-2xl font-semibold text-slate-700">Match each letter to its partner or picture!</p>
                        </div>

                        <div class="relative w-full flex-1 my-4 flex items-center justify-between px-6">
                            <div class="flex flex-col justify-around h-full z-10 space-y-4">
                                ${leftCol.map(l => `
                                    <div class="flex items-center gap-4">
                                        <div class="w-24 h-24 rounded-3xl bg-white border-4 border-slate-800 shadow-sm flex items-center justify-center text-4xl font-bold text-slate-900">
                                            ${l.label}
                                        </div>
                                        <div class="w-5 h-5 rounded-full bg-slate-800"></div>
                                    </div>
                                `).join('')}
                            </div>

                            <div class="flex flex-col justify-around h-full z-10 space-y-4">
                                ${rightCol.map(r => `
                                    <div class="flex items-center gap-4">
                                        <div class="w-5 h-5 rounded-full bg-slate-800"></div>
                                        <div class="w-40 h-24 rounded-3xl bg-white border-4 border-slate-800 shadow-sm flex flex-col items-center justify-center p-2">
                                            ${r.html}
                                            <span class="text-xs font-bold text-slate-700 mt-1">${r.text}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="w-full flex justify-between items-center text-slate-600 font-bold text-sm px-2">
                            <span>English Alphabet (Ages 3–6)</span>
                            <span>Letter ${d.letter}${d.lower} • Page 5</span>
                        </div>
                    </div>
                    <canvas class="page-interactive-canvas" data-page="${pageNumber}"></canvas>
                </div>`;
            }
        }

        function fillColorElement(el) {
            el.style.fill = currentColor;
        }

        function clearCurrentPageDrawing() {
            delete savedPageDrawings[currentPageIndex];
            renderCurrentPage();
        }

        function initCanvases(container) {
            const canvases = container.querySelectorAll('.page-interactive-canvas');
            canvases.forEach(canvas => {
                canvas.width = 794;
                canvas.height = 1123;
                const ctx = canvas.getContext('2d');
                let drawing = false;

                if (savedPageDrawings[currentPageIndex]) {
                    const img = new Image();
                    img.onload = () => ctx.drawImage(img, 0, 0);
                    img.src = savedPageDrawings[currentPageIndex];
                }

                const getPos = (e) => {
                    const r = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: (clientX - r.left) * (canvas.width / r.width),
                        y: (clientY - r.top) * (canvas.height / r.height)
                    };
                };

                const start = (e) => {
                    drawing = true;
                    const pos = getPos(e);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                };

                const move = (e) => {
                    if (!drawing) return;
                    if (e.cancelable) e.preventDefault();
                    const pos = getPos(e);

                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    if (currentTool === 'eraser') {
                        ctx.globalCompositeOperation = 'destination-out';
                        ctx.lineWidth = 32;
                    } else if (currentTool === 'brush') {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = currentColor + '66';
                        ctx.lineWidth = 26;
                    } else {
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.strokeStyle = currentColor;
                        ctx.lineWidth = 7;
                    }

                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                };

                const end = () => {
                    if (drawing) {
                        drawing = false;
                        savedPageDrawings[currentPageIndex] = canvas.toDataURL();
                    }
                };

                canvas.addEventListener('mousedown', start);
                canvas.addEventListener('mousemove', move);
                window.addEventListener('mouseup', end);

                canvas.addEventListener('touchstart', start, { passive: false });
                canvas.addEventListener('touchmove', move, { passive: false });
                window.addEventListener('touchend', end);
            });
        }

        function renderCurrentPage() {
            const slot = document.getElementById('activePageSlot');
            const pageObj = allPagesList[currentPageIndex];
            slot.innerHTML = generatePageHTML(pageObj, currentPageIndex + 1);
            document.getElementById('pageIndicator').textContent = `${currentPageIndex + 1} / ${allPagesList.length}`;

            const sel = document.getElementById('letterSelector');
            if (currentPageIndex <= 1) {
                sel.value = String(currentPageIndex);
            } else if (currentPageIndex === allPagesList.length - 1) {
                sel.value = String(allPagesList.length - 1);
            } else if (currentPageIndex === allPagesList.length - 2) {
                sel.value = String(allPagesList.length - 2);
            } else {
                const letterStart = Math.floor((currentPageIndex - 2) / 5) * 5 + 2;
                sel.value = String(letterStart);
            }

            setTimeout(() => initCanvases(slot), 50);
        }

        function prevPage() {
            if (currentPageIndex > 0) {
                currentPageIndex--;
                renderCurrentPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function nextPage() {
            if (currentPageIndex < allPagesList.length - 1) {
                currentPageIndex++;
                renderCurrentPage();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToLetter(pageIdxStr) {
            currentPageIndex = parseInt(pageIdxStr, 10) || 0;
            renderCurrentPage();
        }

        function printCurrentLetterOnly() {
            const printBox = document.getElementById('printContainer');
            let pagesToPrint = [];

            if (currentPageIndex <= 1 || currentPageIndex >= allPagesList.length - 2) {
                pagesToPrint.push(allPagesList[currentPageIndex]);
            } else {
                const startIdx = Math.floor((currentPageIndex - 2) / 5) * 5 + 2;
                for (let i = startIdx; i < startIdx + 5; i++) {
                    pagesToPrint.push(allPagesList[i]);
                }
            }

            printBox.innerHTML = pagesToPrint.map((p, idx) => {
                return generatePageHTML(p, idx + 1).replace(/<canvas[^>]*><\/canvas>/g, '');
            }).join('');

            const imgs = Array.from(printBox.querySelectorAll('img'));
            let loadedCount = 0;
            const totalImgs = imgs.length;

            let printFired = false;
            const triggerPrint = () => {
                if (printFired) return;
                printFired = true;
                setTimeout(() => {
                    window.print();
                    setTimeout(() => { printBox.innerHTML = ''; }, 1000);
                }, 400);
            };

            if (totalImgs === 0) {
                triggerPrint();
                return;
            }

            imgs.forEach(img => {
                if (img.complete && img.naturalHeight !== 0) {
                    loadedCount++;
                    if (loadedCount >= totalImgs) triggerPrint();
                } else {
                    img.addEventListener('load', () => {
                        loadedCount++;
                        if (loadedCount >= totalImgs) triggerPrint();
                    }, { once: true });
                    img.addEventListener('error', () => {
                        loadedCount++;
                        if (loadedCount >= totalImgs) triggerPrint();
                    }, { once: true });
                }
            });
        }

        function printFullBook() {
            const printBox = document.getElementById('printContainer');
            printBox.innerHTML = allPagesList.map((p, idx) => {
                return generatePageHTML(p, idx + 1).replace(/<canvas[^>]*><\/canvas>/g, '');
            }).join('');

            // الانتظار التام حتى يتم تحميل جميع الـ 52 صورة في كل الـ 134 صفحة قبل فتح نافذة الطباعة والحفظ PDF
            const imgs = Array.from(printBox.querySelectorAll('img'));
            let loadedCount = 0;
            const totalImgs = imgs.length;

            let printFired = false;
            const triggerPrint = () => {
                if (printFired) return;
                printFired = true;
                setTimeout(() => {
                    window.print();
                    setTimeout(() => { printBox.innerHTML = ''; }, 1000);
                }, 800);
            };

            if (totalImgs === 0) {
                triggerPrint();
                return;
            }

            imgs.forEach(img => {
                if (img.complete && img.naturalHeight !== 0) {
                    loadedCount++;
                    if (loadedCount >= totalImgs) triggerPrint();
                } else {
                    img.addEventListener('load', () => {
                        loadedCount++;
                        if (loadedCount >= totalImgs) triggerPrint();
                    }, { once: true });
                    img.addEventListener('error', () => {
                        loadedCount++;
                        if (loadedCount >= totalImgs) triggerPrint();
                    }, { once: true });
                }
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hostname.includes('netlify.app') || window.location.hostname.includes('github.io')) {
                const authorBox = document.getElementById('authorQrBox');
                if (authorBox) authorBox.style.display = 'none';
            }
            buildPageRegistry();
            renderCurrentPage();
        });
    </script>
